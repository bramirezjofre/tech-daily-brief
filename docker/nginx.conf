server {
    listen ${NGINX_PORT} default_server;
    listen [::]:${NGINX_PORT} default_server;
    server_name ${NGINX_HOST};

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Hardening: never serve directory listings or dotfiles.
    # ------------------------------------------------------------------
    autoindex off;
    server_tokens off;

    # Limit request size to a sane value (assets are far below this).
    client_max_body_size 10m;
    client_body_buffer_size 16k;

    # Hide sensitive files even if they somehow end up in the image.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(md|mdx|markdown|map|ts|tsx|js|cjs|mjs|css\.map|json\.map)$ {
        # Allow real assets (CSS/JS) but block source maps and any leftover
        # source files if the build ever leaks them.
        if ($uri ~ \.(md|mdx|markdown)$) { return 404; }
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Static asset caching — Astro fingerprints everything under /_astro/
    # and ships long-lived images, so we can be aggressive there.
    # ------------------------------------------------------------------
    location ~* ^/_astro/.*\.(js|css|woff2?|ttf|svg|png|jpe?g|webp|avif|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # HTML: always serve fresh so deploys are seen immediately.
    # ------------------------------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Security headers — minimal, pagefind/PagefindUI is inline-friendly
    # and we don't load anything user-supplied at runtime.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP is intentionally loose to keep the existing Astro/Pagefind inline
    # scripts working. Tighten after verifying the page in DevTools.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ------------------------------------------------------------------
    # SPA-style routing for Astro static: try the path, then 404.html.
    # We do NOT redirect unknown paths — that would break the static URLs.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Never serve the runtime /usr/share/nginx/html listing.
    location = / {
        try_files /index.html =404;
    }

    # robots.txt and sitemap live at the root, generated by Astro.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap-index.xml { try_files $uri =404; }
    location = /sitemap-0.xml { try_files $uri =404; }
    location = /rss.xml { try_files $uri =404; }

    # Block obvious probes / source paths in case of misconfig upstream.
    location ~* ^/(src|content|node_modules|\.git|\.env|package\.json|tsconfig\.json) {
        return 404;
    }
}
