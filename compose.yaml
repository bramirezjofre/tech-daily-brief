# ==============================================================================
# Production stack — pulls the published image from GHCR and serves it via
# hardened Nginx. The image is built and pushed by `.github/workflows/ci.yml`
# on every successful push to `main`, tagged as both `latest` and `sha-<7>`.
# ==============================================================================
# Quick reference:
#   docker compose --profile prod up -d              # deploy latest
#   docker compose pull && docker compose up -d     # refresh and redeploy
#   IMAGE=ghcr.io/bramirezjofre/tech-daily-brief:sha-abcdef0 \
#     docker compose --profile prod up -d           # pin a specific commit
#   WEB_PORT=80 docker compose --profile prod up -d # expose on port 80
# ==============================================================================
name: ping-diario

services:
  web:
    profiles: ["prod"]
    image: ${IMAGE:-ghcr.io/bramirezjofre/tech-daily-brief:latest}
    container_name: ping-diario-web
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=1777
      - /var/run:size=4m,uid=101,gid=101,mode=1777
      - /tmp:size=16m,uid=101,gid=101,mode=1777
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      NGINX_PORT: "8080"
      NGINX_HOST: "_"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ============================================================================
  # Development stack — `astro dev` with hot reload.
  # Run with: docker compose --profile dev up
  # ============================================================================
  dev:
    profiles: ["dev"]
    image: node:24.12.0-alpine
    container_name: ping-diario-dev
    working_dir: /app
    command:
      - sh
      - -c
      - |
        corepack enable &&
        corepack prepare pnpm@11.9.0 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm run dev --host 0.0.0.0
    ports:
      - "4321:4321"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
