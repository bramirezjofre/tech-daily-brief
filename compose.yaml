# ==============================================================================
# Production stack — builds the static site and serves it via hardened Nginx.
# ==============================================================================
name: ping-diario

services:
  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ASTRO_BASE: "/"
    image: ping-diario:latest
    container_name: ping-diario-web
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=1777
      - /var/run:size=4m,uid=101,gid=101,mode=1777
      - /tmp:size=16m,uid=101,gid=101,mode=1777
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      NGINX_PORT: "8080"
      NGINX_HOST: "_"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ============================================================================
  # Development stack — `astro dev` with hot reload.
  # Run with: docker compose --profile dev up
  # ============================================================================
  dev:
    profiles: ["dev"]
    image: node:24.12.0-alpine
    container_name: ping-diario-dev
    working_dir: /app
    command:
      - sh
      - -c
      - |
        corepack enable &&
        corepack prepare pnpm@11.9.0 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm run dev --host 0.0.0.0
    ports:
      - "4321:4321"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
