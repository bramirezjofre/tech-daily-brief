name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:
  push:
    branches:
      - main
      - feat/cover-image-pipeline

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format (diff vs base)"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FORMAT_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          fi
          pnpm run format:diff

      - name: "🚀 Build the project"
        run: pnpm run build

      - name: "🛡️ Verify build artifact"
        run: pnpm run verify:dist

  docker:
    name: Docker build & artifact scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🏗️ Build image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ping-diario:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "🔍 Scan image for forbidden paths"
        run: |
          set -e
          docker create --name ping-diario-scan ping-diario:ci
          trap 'docker rm -f ping-diario-scan' EXIT
          echo "::group::Image contents under /usr/share/nginx/html"
          docker cp ping-diario-scan:/usr/share/nginx/html - | tar -t | head -50
          echo "::endgroup::"
          echo "Checking for forbidden paths inside image..."
          docker cp ping-diario-scan:/usr/share/nginx/html - \
            | tar -t \
            | grep -E '(^|/)(\.git|\.env|src/|content/|node_modules/|\.md$|\.mdx$|\.map$)' \
            && { echo "✗ Forbidden path detected in image"; exit 1; } \
            || echo "✓ Image artifact is clean"

      - name: "🚀 Smoke test (read-only + tmpfs, like compose.yaml)"
        run: |
          set -uo pipefail
          # Replicate the `web` service in compose.yaml: read-only filesystem
          # with the same tmpfs mounts so nginx (running as uid 101) can write
          # its PID under /var/run and cache under /var/cache/nginx. Do NOT
          # pass --rm so we can inspect logs if the container exits early.
          docker run -d \
            --name ping-diario-smoke \
            -p 8080:8080 \
            --read-only \
            --tmpfs /var/cache/nginx:size=32m,uid=101,gid=101,mode=1777 \
            --tmpfs /var/run:size=4m,uid=101,gid=101,mode=1777 \
            --tmpfs /tmp:size=16m,uid=101,gid=101,mode=1777 \
            ping-diario:ci

          cleanup() {
            docker rm -f ping-diario-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Probe up to 30s instead of a fixed `sleep 3`; nginx may need more
          # time on first start, especially on GitHub-hosted runners.
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/index.html http://127.0.0.1:8080/; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::group::Container status"
            docker ps -a --filter name=ping-diario-smoke
            echo "::group::Container logs"
            docker logs ping-diario-smoke || true
            echo "::group::Container inspect"
            docker inspect --format '{{json .State}}' ping-diario-smoke || true
            echo "::endgroup::"
            echo "✗ Smoke test: curl to http://127.0.0.1:8080/ never succeeded."
            exit 1
          fi

          head -1 /tmp/index.html
          echo "✓ Smoke test: served index.html from the container."
