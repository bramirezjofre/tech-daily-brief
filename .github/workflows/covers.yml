name: Generate cover images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "covers-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  covers:
    name: Build site and export covers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: "Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🚀 Build site (satori OG images go to dist/posts/<slug>/index.png)"
        run: pnpm run build

      - name: "🛡️ Verify dist artifact"
        run: pnpm run verify:dist

      - name: "🖼️ Export cover PNGs and patch posts"
        id: export
        run: node scripts/export-covers.mjs

      - name: "🔁 Re-validate after patches"
        run: pnpm run build:verify
